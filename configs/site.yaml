# 站点配置：执行规范第 1 节。代码只从这里读取这些值，不要硬编码。
# 注释里标 [OQ-n] 的项见 OPEN_QUESTIONS.md。

github:
  owner: Genera1Z
  repo: temporal-compression

slurm:
  # 来源：sbr-roihu.sh（用户已有脚本）
  account: project_2019964        # [OQ-1] 与数据根目录的项目号 2020002 不同，待确认
  partition_gpu: gpumedium
  partition_cpu: null             # [OQ-2] S0 不需要 GPU，Roihu 的 CPU 分区名待确认
  qos: null                       # sbr-roihu.sh 未设 QoS
  gpu_type: gh200
  gpus_per_job: 1                 # “按需确定，节省着用”；默认 1，按阶段在 run.sh 中覆盖
  modules: [python-pytorch]

paths:
  data_root: /scratch/project_2020002
  project_root: /scratch/project_2020002/temporal-compression   # 本项目在数据根下的子目录
  raw: /scratch/project_2020002/temporal-compression/data/raw    # 原始数据实际位置；代码读此路径，仓库内 data/raw 只是占位 [OQ-3]
  interim: /scratch/project_2020002/temporal-compression/data/interim
  hf_home: /scratch/project_2020002/hf_cache                     # Hugging Face 权重缓存，不放主目录
  venv: /scratch/project_2020002/temporal-compression/venv

wandb:
  entity: temporal-compression    # [OQ-4] “同仓库名”；entity 通常是用户名/团队名，待确认
  project: temporal-compression

seeds: [42, 43, 44]               # 沿用 object-centric-bench 约定

results:
  transport: git_branch           # 作业把 results/ 提交到 results 分支
  branch: results

huggingface:
  online: true                    # 集群可联网
  models:
    vjepa2: facebook/vjepa2-vitl-fpc64-256
    # videomae / wan / qwen 的具体 checkpoint 在对应阶段确定

osf_projects:
  zkwf2: {paper: "Leroy, Majerus & D'Argembeau 2024 (Cognition)", role: dev}
  2xt93: {paper: "Leroy & D'Argembeau 2025 (Memory)", role: dev}
  6aecj: {paper: "Leroy & D'Argembeau 2025 (Open Mind)", role: test_zero_shot}
  uny8r: {paper: "Jeunehomme et al. 2020", role: optional}
